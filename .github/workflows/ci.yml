name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile research_paper_downloader.py
      - name: Import check (no network, no Ollama needed)
        run: python -c "import research_paper_downloader; from bs4 import BeautifulSoup; BeautifulSoup('<a/>', 'xml')"
